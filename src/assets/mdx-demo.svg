<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">Atlas demo: from a note to a shared decision</title>
  <desc id="desc">An engineering drawing connecting three cards labeled Observe, Explore, and Decide.</desc>
  <rect width="1200" height="750" fill="#101719" />
  <g fill="none" stroke="#35504c" stroke-width="1">
    <path d="M80 0V750M1120 0V750M0 100H1200M0 650H1200M400 100V650M800 100V650" stroke-dasharray="4 8" />
    <circle cx="600" cy="375" r="240" />
    <path d="M340 375H430M760 375H850" stroke="#8ed9bb" stroke-width="2" />
    <path d="m418 367 12 8-12 8m420-16 12 8-12 8" stroke="#8ed9bb" stroke-width="2" />
  </g>
  <g fill="#152222" stroke="#8ed9bb" stroke-width="2">
    <rect x="110" y="275" width="230" height="200" rx="8" />
    <rect x="430" y="245" width="330" height="260" rx="8" />
    <rect x="850" y="275" width="230" height="200" rx="8" />
  </g>
  <g fill="#bdd1c9" font-family="monospace" font-size="18" letter-spacing="2">
    <text x="110" y="160">ATLAS / CONTENT DEMO</text>
    <text x="140" y="315">01</text>
    <text x="465" y="290">02</text>
    <text x="880" y="315">03</text>
    <text x="110" y="610">A NOTE BECOMES A SHARED DECISION.</text>
  </g>
  <g fill="#f3f0e9" font-family="sans-serif" font-size="34">
    <text x="140" y="370">Observe</text>
    <text x="465" y="345">Explore</text>
    <text x="880" y="370">Decide</text>
  </g>
  <g fill="none" stroke="#739488" stroke-width="4" stroke-linecap="round">
    <path d="M140 410H275M140 430H235M465 390H705M465 415H655M465 440H680M880 410H1020M880 430H985" />
  </g>
</svg>
